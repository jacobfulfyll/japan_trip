<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newly Weds in Japan!</title>

    <!-- PWA: installable + offline (service worker registered before </body>). -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icon-192.png" type="image/png">
    <meta name="theme-color" content="#0b3d66">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Japan Trip">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #203140;
            --ink-soft: #4f6577;
            --line: rgba(101, 78, 48, 0.28);
            --paper-bg: #e4d5bd;
            --paper-surface: rgba(241, 231, 214, 0.8);
            --paper-header: rgba(244, 236, 222, 0.92);
            --paper-nav: rgba(238, 227, 209, 0.92);
            --paper-btn: rgba(244, 236, 221, 0.95);
            --paper-panel: rgba(243, 233, 216, 0.9);
            --paper-panel-alt: rgba(236, 221, 198, 0.74);
            --card: rgba(245, 236, 221, 0.9);
            --card-solid: #f3e8d5;
            --brand-deep: #0b3d66;
            --brand-mid: #12628f;
            --brand-glow: #f3cb72;
            --shadow-lg: 0 24px 64px rgba(6, 28, 45, 0.25);
            --shadow-md: 0 10px 24px rgba(9, 40, 63, 0.18);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Manrope", "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--paper-bg);
            padding: 14px;
            overflow: hidden;
        }

        .wave-art {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 18% 16%, rgba(206, 183, 154, 0.3) 0%, rgba(206, 183, 154, 0) 40%),
                radial-gradient(circle at 80% 22%, rgba(194, 170, 143, 0.24) 0%, rgba(194, 170, 143, 0) 45%),
                radial-gradient(circle at 64% 74%, rgba(214, 191, 163, 0.18) 0%, rgba(214, 191, 163, 0) 46%),
                linear-gradient(152deg, rgba(243, 234, 221, 0.93), rgba(224, 210, 189, 0.87)),
                url("https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg") center/cover no-repeat;
            transform: scale(1.03);
        }

        .wave-layer {
            position: fixed;
            left: -15%;
            width: 130%;
            border-radius: 50%;
            pointer-events: none;
            z-index: -2;
            opacity: 0.24;
            background:
                radial-gradient(ellipse at center, rgba(19, 94, 141, 0.58) 0%, rgba(19, 94, 141, 0.15) 54%, rgba(19, 94, 141, 0) 82%),
                linear-gradient(180deg, rgba(132, 183, 219, 0.38), rgba(132, 183, 219, 0.05));
            animation: swell 20s ease-in-out infinite;
        }

        .wave-layer.one {
            height: 40vh;
            bottom: -16vh;
        }

        .wave-layer.two {
            height: 34vh;
            bottom: 5vh;
            opacity: 0.2;
            animation-duration: 16s;
            animation-direction: reverse;
        }

        .app {
            max-width: 1360px;
            margin: 0 auto;
            height: calc(100vh - 28px);
            background: var(--paper-surface);
            border: 1px solid rgba(13, 52, 81, 0.27);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
        }

        .simple-header {
            padding: 16px 20px 11px;
            border-bottom: 1px solid var(--line);
            background:
                radial-gradient(circle at 84% 25%, rgba(191, 166, 136, 0.24) 0%, rgba(191, 166, 136, 0) 52%),
                linear-gradient(180deg, var(--paper-header), rgba(236, 224, 205, 0.86));
        }

        .simple-header h1 {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: clamp(1.55rem, 2.8vw, 2.2rem);
            line-height: 1.1;
        }

        .simple-header p {
            margin-top: 5px;
            color: var(--ink-soft);
            font-size: 0.87rem;
        }

        .tab-nav {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--paper-nav);
            backdrop-filter: blur(8px);
        }

        .tab-btn {
            border: 1px solid rgba(13, 65, 101, 0.28);
            background: var(--paper-btn);
            color: var(--brand-deep);
            border-radius: 999px;
            padding: 8px 13px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .tab-btn:hover {
            transform: translateY(-1px);
        }

        .tab-btn.active {
            border-color: transparent;
            background: linear-gradient(120deg, var(--brand-deep), var(--brand-mid));
            color: #fff;
            box-shadow: 0 8px 16px rgba(10, 61, 95, 0.28);
        }

        .tab-btn.research-tab {
            border-color: rgba(184, 92, 70, 0.42);
            background: #fde6df;
            color: #8a3f30;
        }

        .tab-btn.research-tab:hover {
            background: #fbdace;
        }

        .tab-btn.research-tab.active {
            background: linear-gradient(120deg, #ee9a82, #d9776f);
            color: #fffaf8;
            box-shadow: 0 8px 16px rgba(170, 92, 78, 0.28);
        }

        .panel-shell {
            --panel-inset: 12px;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .tab-panel {
            position: absolute;
            inset: var(--panel-inset);
            padding: 14px;
            border: 1px solid rgba(13, 53, 84, 0.15);
            border-radius: var(--radius-lg);
            background:
                radial-gradient(circle at 12% 8%, rgba(183, 154, 123, 0.2) 0%, rgba(183, 154, 123, 0) 40%),
                radial-gradient(circle at 88% 18%, rgba(164, 137, 108, 0.16) 0%, rgba(164, 137, 108, 0) 43%),
                radial-gradient(circle at 68% 82%, rgba(190, 164, 132, 0.16) 0%, rgba(190, 164, 132, 0) 45%),
                linear-gradient(145deg, var(--paper-panel), var(--paper-panel-alt));
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(15, 74, 114, 0.5) transparent;
            opacity: 0;
            transform: translateY(16px);
            filter: blur(2px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease, filter 0.3s ease;
        }

        .tab-panel.panel-visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            pointer-events: auto;
        }

        .tab-panel[hidden] {
            display: block;
        }

        .tab-panel::-webkit-scrollbar {
            width: 10px;
        }

        .tab-panel::-webkit-scrollbar-thumb {
            background: rgba(15, 74, 114, 0.5);
            border-radius: 999px;
        }

        .section-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: clamp(1.3rem, 2vw, 1.9rem);
            margin-bottom: 8px;
        }

        .section-lead {
            color: var(--ink-soft);
            font-size: 0.9rem;
            max-width: 84ch;
            margin-bottom: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--card-solid);
            border: 1px solid rgba(13, 54, 84, 0.15);
            border-radius: 12px;
            padding: 12px;
            box-shadow: var(--shadow-md);
        }

        .stat-card p {
            color: #4e6a81;
            font-size: 0.73rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-card h3 {
            color: var(--brand-deep);
            font-size: 1.22rem;
            font-weight: 800;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(13, 57, 89, 0.16);
            border-radius: var(--radius-md);
            padding: 13px;
            box-shadow: var(--shadow-md);
        }

        .card h3 {
            color: var(--brand-deep);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .card h4 {
            color: #144f79;
            margin-bottom: 6px;
            font-size: 0.86rem;
        }

        .card p,
        .card li,
        .card td,
        .card th {
            color: #2c4459;
            font-size: 0.87rem;
            line-height: 1.42;
        }

        .card ul {
            padding-left: 18px;
        }

        .card li {
            margin-bottom: 6px;
        }

        .route-list {
            display: grid;
            gap: 9px;
        }

        .route-item {
            display: grid;
            grid-template-columns: 112px 1fr;
            border: 1px solid rgba(15, 63, 98, 0.16);
            border-radius: 11px;
            overflow: hidden;
            background: rgba(244, 234, 217, 0.95);
        }

        .route-item .date {
            background: linear-gradient(180deg, rgba(220, 200, 174, 0.92), rgba(236, 222, 201, 0.92));
            color: var(--brand-deep);
            font-size: 0.8rem;
            font-weight: 800;
            padding: 10px;
        }

        .route-item .detail {
            padding: 10px;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .chip {
            border: 1px solid rgba(16, 75, 115, 0.2);
            border-radius: 999px;
            background: rgba(234, 219, 196, 0.88);
            color: #134f7b;
            padding: 5px 10px;
            font-size: 0.74rem;
            font-weight: 700;
        }

        .image-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .image-strip figure {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(15, 61, 94, 0.16);
            background: rgba(244, 235, 221, 0.94);
            box-shadow: var(--shadow-md);
        }

        .image-strip img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            display: block;
        }

        .image-strip figcaption {
            padding: 7px 9px;
            font-size: 0.75rem;
            color: #46637a;
            border-top: 1px solid rgba(15, 61, 94, 0.12);
            background: rgba(239, 226, 205, 0.9);
        }

        .table-wrap {
            overflow: auto;
            border: 1px solid rgba(15, 62, 96, 0.16);
            border-radius: 12px;
            background: rgba(244, 235, 218, 0.95);
        }

        table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid rgba(13, 56, 88, 0.1);
            vertical-align: top;
        }

        th {
            background: #0f5d8d;
            color: #fff;
            font-size: 0.79rem;
            letter-spacing: 0.02em;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .callout {
            margin-top: 10px;
            border: 1px solid rgba(173, 132, 44, 0.34);
            border-radius: 11px;
            background: rgba(247, 231, 201, 0.86);
            color: #5d4516;
            padding: 10px;
            font-size: 0.82rem;
        }

        .callout.cool {
            border-color: rgba(36, 105, 149, 0.34);
            background: rgba(223, 206, 183, 0.88);
            color: #1f567c;
        }

        .budget-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .budget-tile {
            background: rgba(244, 235, 220, 0.95);
            border: 1px solid rgba(15, 64, 99, 0.16);
            border-radius: 12px;
            padding: 11px;
            box-shadow: var(--shadow-md);
        }

        .budget-tile .label {
            font-size: 0.75rem;
            color: #4f677c;
            margin-bottom: 5px;
        }

        .budget-tile .amount {
            font-size: 1.15rem;
            color: var(--brand-deep);
            font-weight: 800;
        }

        .timeline-tab {
            display: grid;
            grid-template-rows: auto auto auto 1fr auto;
            gap: 8px;
            overflow: hidden;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .timeline-status {
            color: #47647c;
            font-size: 0.83rem;
        }

        .timeline-controls {
            display: flex;
            gap: 7px;
        }

        .timeline-nav-btn {
            border: 1px solid rgba(12, 57, 88, 0.28);
            border-radius: 999px;
            background: rgba(242, 232, 217, 0.95);
            color: var(--brand-deep);
            width: 32px;
            height: 32px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .timeline-nav-btn:hover {
            transform: translateY(-1px);
        }

        .timeline-signifier {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            opacity: 0.55;
        }

        .timeline-signifier span {
            height: 3px;
            border-radius: 999px;
            background: #466884;
            display: inline-block;
        }

        .timeline-signifier span:nth-child(1) {
            width: 16px;
            opacity: 0.45;
        }

        .timeline-signifier span:nth-child(2) {
            width: 34px;
            opacity: 0.75;
        }

        .timeline-signifier span:nth-child(3) {
            width: 16px;
            opacity: 0.45;
        }

        .timeline-slider {
            display: flex;
            gap: 14px;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding: 2px 2px 10px;
            align-items: stretch;
        }

        .timeline-slider::-webkit-scrollbar {
            height: 9px;
        }

        .timeline-slider::-webkit-scrollbar-thumb {
            background: rgba(14, 70, 108, 0.46);
            border-radius: 999px;
        }

        .timeline-slide {
            flex: 0 0 100%;
            display: grid;
            grid-template-columns: 1fr 1.08fr;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(15, 63, 98, 0.2);
            background: rgba(244, 235, 220, 0.97);
            box-shadow: none;
            scroll-snap-align: center;
            min-height: 0;
            opacity: 0.5;
            transform: translateY(14px) scale(0.975);
            transition: opacity 0.45s ease, transform 0.45s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .timeline-slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            border-color: rgba(243, 203, 114, 0.88);
            box-shadow: none;
        }

        .slide-photo {
            min-height: 310px;
            overflow: hidden;
            position: relative;
            order: 2;
        }

        .slide-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.72;
            filter: saturate(0.88) contrast(0.94);
            transform: scale(1.08);
            transition: opacity 0.55s ease, filter 0.55s ease, transform 0.75s ease;
        }

        .timeline-slide.active .slide-photo img {
            opacity: 1;
            filter: saturate(1.05) contrast(1.02);
            transform: scale(1.02);
        }

        .slide-caption {
            position: absolute;
            left: 10px;
            bottom: 10px;
            color: #eaf3fa;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            border: 1px solid rgba(231, 242, 250, 0.24);
            background: rgba(8, 37, 61, 0.65);
            border-radius: 999px;
            padding: 4px 9px;
        }

        .slide-content {
            padding: 14px;
            display: grid;
            gap: 9px;
            min-height: 0;
            overflow-y: auto;
            order: 1;
        }

        .slide-kicker {
            color: #4f6b82;
            font-size: 0.76rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 800;
        }

        .slide-content h3 {
            color: var(--brand-deep);
            font-size: 1.05rem;
            margin-bottom: 2px;
        }

        .slide-intro {
            color: #304a61;
            font-size: 0.88rem;
        }

        .slide-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .slot {
            border: 1px solid rgba(14, 59, 92, 0.14);
            border-radius: 10px;
            background: rgba(236, 221, 200, 0.72);
            padding: 8px;
        }

        .slot h4 {
            color: #15527d;
            font-size: 0.73rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .slot p {
            color: #2d465a;
            font-size: 0.82rem;
            line-height: 1.36;
        }

        .slide-notes {
            padding-left: 18px;
        }

        .slide-notes li {
            color: #2f4960;
            font-size: 0.83rem;
            margin-bottom: 5px;
        }

        .slide-reveal {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .timeline-slide.active .slide-reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .timeline-dots {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding-top: 2px;
        }

        .timeline-dot {
            width: 7px;
            height: 7px;
            border: none;
            border-radius: 999px;
            background: rgba(21, 80, 123, 0.3);
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .timeline-dot.active {
            background: rgba(21, 80, 123, 0.93);
            transform: scale(1.25);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(14px);
        }

        .fade-in.run {
            animation: rise 0.45s ease forwards;
            animation-delay: var(--delay, 0ms);
        }

        .footer {
            border-top: 1px solid var(--line);
            padding: 8px 14px 10px;
            font-size: 0.74rem;
            color: #4d677d;
            background: rgba(237, 224, 203, 0.92);
        }

        @keyframes swell {
            0% {
                transform: translateX(0) translateY(0) scale(1.02);
            }
            50% {
                transform: translateX(-5%) translateY(-2%) scale(1.07);
            }
            100% {
                transform: translateX(2%) translateY(1%) scale(1.02);
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1100px) {
            .stats-row,
            .grid-2,
            .grid-3,
            .budget-grid,
            .image-strip,
            .slide-grid {
                grid-template-columns: 1fr;
            }

            .timeline-slide {
                grid-template-columns: 1fr;
            }

            .slide-photo {
                min-height: 220px;
                order: 1;
            }

            .slide-content {
                order: 2;
            }
        }

        @media (max-width: 760px) {
            body {
                padding: 8px;
            }

            .app {
                height: calc(100vh - 16px);
            }

            .simple-header {
                padding: 12px 12px 9px;
            }

            .tab-nav {
                padding: 8px;
                gap: 6px;
                flex-wrap: nowrap;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .tab-nav::-webkit-scrollbar {
                display: none;
            }

            .tab-btn {
                font-size: 0.72rem;
                padding: 7px 10px;
                flex-shrink: 0;
            }

            .panel-shell {
                --panel-inset: 8px;
            }

            .route-item {
                grid-template-columns: 1fr;
            }

            .route-item .date {
                border-bottom: 1px solid rgba(15, 63, 98, 0.14);
            }

            .slide-photo {
                min-height: 100px;
                max-height: 120px;
            }

            .slide-content {
                padding: 10px 12px;
                gap: 6px;
            }

            .slide-kicker {
                font-size: 0.7rem;
            }

            .slide-content h3 {
                font-size: 0.95rem;
            }

            .slide-intro {
                font-size: 0.82rem;
            }

            .slot {
                padding: 6px;
            }

            .slot h4 {
                font-size: 0.72rem;
            }

            .slot p {
                font-size: 0.76rem;
            }

            .slide-notes li {
                font-size: 0.78rem;
                margin-bottom: 3px;
            }

            .timeline-header,
            .timeline-status,
            .timeline-signifier {
                display: none;
            }

            .timeline-slide {
                overflow-y: auto;
                overflow-x: hidden;
            }

            .slide-photo {
                position: sticky;
                top: 0;
                z-index: 2;
                min-height: 40px;
                max-height: 120px;
                transition: max-height 0.15s ease-out;
            }

            .slide-photo.collapsed {
                max-height: 40px;
            }

            .slide-content {
                overflow-y: visible;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }

            .fade-in,
            .fade-in.run {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
    <!--
      Scaffold-only styles. Kept separate from the preserved ukiyo-e theme block
      above so downstream screen tasks can delete this block wholesale when they
      replace the proof-of-pipeline render in app.js. The theme block (tokens,
      resets, .wave-art / .wave-layer) is intentionally left untouched.
      Note: the theme sets `body { overflow: hidden }` for the old single-screen
      app; the scaffold renders a scrollable list, so we re-enable scrolling here.
    -->
    <style>
        body { overflow: auto; }

        #app-root {
            max-width: 880px;
            margin: 0 auto;
            min-height: calc(100vh - 28px);
        }

        .scaffold-header {
            background: var(--paper-header);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(8px);
        }

        .scaffold-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            line-height: 1.1;
        }

        .scaffold-sub { color: var(--ink); margin-top: 6px; font-weight: 600; }
        .scaffold-note { color: var(--ink-soft); margin-top: 4px; font-size: 0.9rem; }

        .scaffold-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .scaffold-day {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(6px);
        }

        .scaffold-day-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
        }

        .scaffold-daynum {
            background: var(--brand-mid);
            color: #fff;
            border-radius: 999px;
            padding: 2px 10px;
            font-weight: 700;
        }

        .scaffold-date { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
        .scaffold-base { color: var(--brand-deep); font-weight: 600; margin-left: auto; }

        .scaffold-day-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.1rem;
            line-height: 1.25;
            margin: 8px 0 6px;
        }

        .scaffold-counts { color: var(--ink-soft); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="wave-art" aria-hidden="true"></div>
    <div class="wave-layer one" aria-hidden="true"></div>
    <div class="wave-layer two" aria-hidden="true"></div>

    <!--
      Slim shell. The whole UI is rendered by app.js into #app-root from
      data/days.js (the single source of truth). No build step, no bundler —
      plain ES modules served as static files on GitHub Pages.

      AUX-TAB DECISION: the old tabbed app's aux tabs (Transport, Costs/budget,
      Flights, Culture+Prep, Priority Research) were DROPPED here. They were
      stale pre-booking planning (cost estimates, a pre-booking research hub,
      an "Updated March 5" footer) and are out of scope for the daily-companion
      redesign — downstream tasks own these screens. Evergreen reference content
      (booked flight times, transport-pass notes, etiquette prep) already lives
      in data/days.js per-day `prep[]` and `plan[]` entries, which is where the
      companion surfaces it. No aux-tab UI is rebuilt in this scaffold.
    -->
    <main id="app-root"></main>

    <script type="module" src="app.js"></script>

    <!--
      Service worker registration (makes the site installable + offline-capable).
      Plain (non-module) script; a relative path so it resolves under the GitHub
      Pages project subpath (/japan_trip/) as well as the domain root. Guarded by
      a feature check, and registered on window load so it never competes with
      first paint.
    -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('[sw] registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
