<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newly Weds in Japan!</title>

    <!-- PWA: installable + offline (service worker registered before </body>). -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icon-192.png" type="image/png">
    <meta name="theme-color" content="#0b3d66">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Japan Trip">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #203140;
            --ink-soft: #4f6577;
            --line: rgba(101, 78, 48, 0.28);
            --paper-bg: #e4d5bd;
            --paper-surface: rgba(241, 231, 214, 0.8);
            --paper-header: rgba(244, 236, 222, 0.92);
            --paper-nav: rgba(238, 227, 209, 0.92);
            --paper-btn: rgba(244, 236, 221, 0.95);
            --paper-panel: rgba(243, 233, 216, 0.9);
            --paper-panel-alt: rgba(236, 221, 198, 0.74);
            --card: rgba(245, 236, 221, 0.9);
            --card-solid: #f3e8d5;
            --brand-deep: #0b3d66;
            --brand-mid: #12628f;
            --brand-glow: #f3cb72;
            --shadow-lg: 0 24px 64px rgba(6, 28, 45, 0.25);
            --shadow-md: 0 10px 24px rgba(9, 40, 63, 0.18);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Manrope", "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--paper-bg);
            padding: 14px;
            overflow: hidden;
        }

        .wave-art {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 18% 16%, rgba(206, 183, 154, 0.3) 0%, rgba(206, 183, 154, 0) 40%),
                radial-gradient(circle at 80% 22%, rgba(194, 170, 143, 0.24) 0%, rgba(194, 170, 143, 0) 45%),
                radial-gradient(circle at 64% 74%, rgba(214, 191, 163, 0.18) 0%, rgba(214, 191, 163, 0) 46%),
                linear-gradient(152deg, rgba(243, 234, 221, 0.93), rgba(224, 210, 189, 0.87)),
                url("https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg") center/cover no-repeat;
            transform: scale(1.03);
        }

        .wave-layer {
            position: fixed;
            left: -15%;
            width: 130%;
            border-radius: 50%;
            pointer-events: none;
            z-index: -2;
            opacity: 0.24;
            background:
                radial-gradient(ellipse at center, rgba(19, 94, 141, 0.58) 0%, rgba(19, 94, 141, 0.15) 54%, rgba(19, 94, 141, 0) 82%),
                linear-gradient(180deg, rgba(132, 183, 219, 0.38), rgba(132, 183, 219, 0.05));
            animation: swell 20s ease-in-out infinite;
        }

        .wave-layer.one {
            height: 40vh;
            bottom: -16vh;
        }

        .wave-layer.two {
            height: 34vh;
            bottom: 5vh;
            opacity: 0.2;
            animation-duration: 16s;
            animation-direction: reverse;
        }

        @keyframes swell {
            0% {
                transform: translateX(0) translateY(0) scale(1.02);
            }
            50% {
                transform: translateX(-5%) translateY(-2%) scale(1.07);
            }
            100% {
                transform: translateX(2%) translateY(1%) scale(1.02);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
    <!--
      Day-view screen styles. The hero slideshow + practical plan layer live
      here; the preserved theme block above keeps the :root tokens, resets, and
      the Great-Wave background (.wave-art / .wave-layer + @keyframes swell).
      Note: the theme sets `body { overflow: hidden }` for the old single-screen
      app; the day view scrolls, so we re-enable scrolling here.
    -->
    <style>
        body { overflow: auto; }

        #app-root {
            max-width: 720px;
            margin: 0 auto;
            min-height: calc(100vh - 28px);
        }

        /* --- Day view shell ---------------------------------------------- */
        .day-view {
            background: var(--paper-surface);
            border: 1px solid rgba(13, 52, 81, 0.22);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        /* --- Hero slideshow ---------------------------------------------- */
        .day-hero {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            max-height: 58vh;
            background: linear-gradient(160deg, rgba(18, 98, 143, 0.22), rgba(11, 61, 102, 0.32));
            overflow: hidden;
        }

        .hero-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.1s ease;
        }

        .hero-slide.is-active {
            opacity: 1;
        }

        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-scrim {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(8, 37, 61, 0.18) 0%,
                rgba(8, 37, 61, 0) 32%,
                rgba(8, 37, 61, 0) 60%,
                rgba(8, 37, 61, 0.28) 100%
            );
        }

        .day-hero-empty {
            aspect-ratio: 16 / 7;
            background:
                radial-gradient(circle at 30% 30%, rgba(206, 183, 154, 0.4), rgba(206, 183, 154, 0) 60%),
                linear-gradient(160deg, rgba(132, 183, 219, 0.32), rgba(224, 210, 189, 0.6));
        }

        /* --- Day header -------------------------------------------------- */
        .day-header {
            padding: 18px 20px 6px;
        }

        .day-kicker-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .day-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-mid);
        }

        .day-number {
            background: var(--brand-deep);
            color: #fff;
            border-radius: 999px;
            padding: 3px 11px;
            font-size: 0.74rem;
            font-weight: 700;
        }

        .day-base {
            color: var(--ink-soft);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .day-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: clamp(1.55rem, 5.5vw, 2.1rem);
            line-height: 1.12;
        }

        .day-intro {
            margin-top: 10px;
            color: var(--ink);
            font-size: 1rem;
            line-height: 1.5;
        }

        .day-intro-prefix {
            font-weight: 700;
            color: var(--brand-mid);
        }

        /* --- Section headings -------------------------------------------- */
        .section-heading {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.25rem;
            padding: 0 20px;
            margin: 22px 0 10px;
        }

        /* --- Plan list (timeline) ---------------------------------------- */
        .plan-section { padding-bottom: 4px; }

        .plan-list {
            list-style: none;
            padding: 0 20px;
            margin: 0;
        }

        .plan-item {
            display: grid;
            grid-template-columns: 22px 1fr;
            gap: 12px;
        }

        .plan-rail {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .plan-rail::after {
            content: "";
            flex: 1;
            width: 2px;
            background: var(--line);
            margin-top: 2px;
        }

        .plan-item:last-child .plan-rail::after { display: none; }

        .plan-dot {
            width: 13px;
            height: 13px;
            border-radius: 999px;
            background: var(--brand-mid);
            border: 2px solid var(--card-solid);
            box-shadow: 0 0 0 1px rgba(13, 65, 101, 0.3);
            margin-top: 5px;
            flex-shrink: 0;
        }

        .plan-body {
            background: var(--card);
            border: 1px solid rgba(13, 57, 89, 0.14);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-md);
        }

        .plan-item-reserved .plan-body {
            border-color: rgba(173, 132, 44, 0.5);
            background: rgba(247, 231, 201, 0.78);
        }

        .plan-item-reserved .plan-dot {
            background: var(--brand-glow);
            box-shadow: 0 0 0 1px rgba(173, 132, 44, 0.6);
        }

        .plan-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .plan-time {
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            color: var(--brand-deep);
            font-size: 0.92rem;
        }

        .plan-tag {
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 0.64rem;
            font-weight: 800;
            color: #134f7b;
            background: rgba(234, 219, 196, 0.9);
            border: 1px solid rgba(16, 75, 115, 0.2);
            border-radius: 999px;
            padding: 3px 9px;
        }

        .tag-meal { color: #8a4f1f; background: rgba(244, 224, 199, 0.9); border-color: rgba(160, 100, 40, 0.3); }
        .tag-transit { color: #3a5a7a; }
        .tag-sight { color: #2e6b4a; background: rgba(214, 232, 214, 0.85); border-color: rgba(46, 107, 74, 0.28); }
        .tag-bar { color: #6b3f7a; background: rgba(231, 216, 238, 0.85); border-color: rgba(107, 63, 122, 0.28); }
        .tag-spa { color: #6b3f7a; background: rgba(231, 216, 238, 0.85); border-color: rgba(107, 63, 122, 0.28); }

        .plan-reserved-badge {
            font-size: 0.64rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #5d4516;
            background: var(--brand-glow);
            border-radius: 999px;
            padding: 3px 9px;
        }

        .plan-title {
            color: var(--brand-deep);
            font-size: 1.02rem;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .plan-note {
            color: #2c4459;
            font-size: 0.9rem;
            line-height: 1.46;
        }

        /* --- Map links (large tap targets) ------------------------------- */
        .map-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 9px;
            min-height: 40px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(16, 75, 115, 0.32);
            background: var(--paper-btn);
            color: var(--brand-deep);
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
        }

        .map-link::before {
            content: "📍";
            font-size: 0.9rem;
        }

        .map-link:hover { background: #fff; }
        .map-link:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: 2px; }

        /* --- Recommendation expansion ------------------------------------ */
        .rec-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            min-height: 44px;
            margin-top: 10px;
            padding: 10px 14px;
            border: 1px dashed rgba(16, 75, 115, 0.42);
            border-radius: var(--radius-md);
            background: rgba(244, 236, 221, 0.7);
            color: var(--brand-deep);
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .rec-toggle:hover { background: rgba(255, 255, 255, 0.65); }
        .rec-toggle:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: 2px; }

        .rec-toggle-chev { transition: transform 0.2s ease; font-size: 0.9rem; }
        .rec-toggle.is-open .rec-toggle-chev { transform: rotate(180deg); }

        .rec-panel {
            display: grid;
            gap: 10px;
            margin-top: 10px;
        }

        .rec-card {
            border: 1px solid rgba(13, 57, 89, 0.16);
            border-radius: var(--radius-md);
            background: var(--card-solid);
            padding: 11px 13px;
        }

        .rec-name {
            color: var(--brand-deep);
            font-size: 0.94rem;
            margin-bottom: 4px;
        }

        .rec-walk {
            font-size: 0.76rem;
            font-weight: 700;
            color: #2e6b4a;
            margin-bottom: 6px;
        }

        .rec-walk::before { content: "🚶 "; }

        .rec-walk-from {
            font-weight: 500;
            color: var(--ink-soft);
        }

        .rec-pros {
            list-style: none;
            padding: 0;
            margin: 0 0 6px;
            display: grid;
            gap: 4px;
        }

        .rec-pro, .rec-con {
            display: flex;
            gap: 7px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #2c4459;
        }

        .rec-con { color: #8a3f30; }

        .rec-mark {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            margin-top: 2px;
        }

        .rec-mark-pro { background: rgba(46, 107, 74, 0.18); color: #2e6b4a; }
        .rec-mark-con { background: rgba(184, 92, 70, 0.18); color: #b85c46; }

        /* --- Lodging card ------------------------------------------------ */
        .lodging-card {
            margin: 20px 20px 22px;
            border: 1px solid rgba(13, 65, 101, 0.2);
            border-radius: var(--radius-lg);
            background:
                radial-gradient(circle at 88% 12%, rgba(191, 166, 136, 0.22) 0%, rgba(191, 166, 136, 0) 55%),
                linear-gradient(150deg, var(--paper-panel), var(--paper-panel-alt));
            padding: 16px 18px;
            box-shadow: var(--shadow-md);
        }

        .lodging-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--brand-mid);
            margin-bottom: 5px;
        }

        .lodging-name {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.15rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .lodging-address {
            color: var(--ink-soft);
            font-size: 0.86rem;
            margin-bottom: 8px;
        }

        .lodging-breakfast {
            color: #2c4459;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .lodging-breakfast-label { font-weight: 800; color: var(--brand-deep); }

        /* --- Reminisce seam (future photo gallery placeholder) ----------- */
        .reminisce-seam {
            margin: 18px 20px 0;
            border: 1px dashed rgba(16, 75, 115, 0.4);
            border-radius: var(--radius-lg);
            background: rgba(243, 233, 216, 0.6);
            padding: 16px 18px;
            text-align: center;
        }

        .seam-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--brand-mid);
            margin-bottom: 5px;
        }

        .seam-note {
            color: var(--ink-soft);
            font-size: 0.88rem;
            line-height: 1.45;
        }

        /* --- Empty / sparse placeholder ---------------------------------- */
        .day-placeholder {
            padding: 30px 22px 36px;
            text-align: center;
        }

        .placeholder-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-mid);
            margin-bottom: 8px;
        }

        .placeholder-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .placeholder-note {
            color: var(--ink-soft);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 38ch;
            margin: 0 auto;
        }

        /* --- Framing variants -------------------------------------------- */
        .framing-anticipation .day-kicker { color: #2e6b4a; }
        .framing-anticipation .day-number { background: #2e6b4a; }
        .framing-anticipation-hero .hero-scrim {
            background: linear-gradient(180deg, rgba(46, 107, 74, 0.16) 0%, rgba(8, 37, 61, 0) 45%, rgba(8, 37, 61, 0.3) 100%);
        }

        .framing-reminisce { filter: saturate(0.92); }
        .framing-reminisce .day-kicker { color: #8a4f1f; }
        .framing-reminisce .day-number { background: #8a4f1f; }
        .framing-reminisce .day-hero { opacity: 0.9; }
        .framing-reminisce-hero .hero-scrim {
            background: linear-gradient(180deg, rgba(138, 79, 31, 0.2) 0%, rgba(8, 37, 61, 0) 45%, rgba(8, 37, 61, 0.34) 100%);
        }

        /* --- Mobile tuning ----------------------------------------------- */
        @media (max-width: 760px) {
            body { padding: 8px; }
            #app-root { min-height: calc(100vh - 16px); }
            .day-hero { aspect-ratio: 1 / 1; max-height: 64vh; }
            .day-header { padding: 16px 16px 4px; }
            .section-heading { padding: 0 16px; }
            .plan-list { padding: 0 16px; }
            .lodging-card { margin: 18px 16px 20px; }
            .reminisce-seam { margin: 16px 16px 0; }
        }
    </style>
</head>
<body>
    <div class="wave-art" aria-hidden="true"></div>
    <div class="wave-layer one" aria-hidden="true"></div>
    <div class="wave-layer two" aria-hidden="true"></div>

    <!--
      Slim shell. The whole UI is rendered by app.js into #app-root from
      data/days.js (the single source of truth). No build step, no bundler —
      plain ES modules served as static files on GitHub Pages.

      AUX-TAB DECISION: the old tabbed app's aux tabs (Transport, Costs/budget,
      Flights, Culture+Prep, Priority Research) were DROPPED here. They were
      stale pre-booking planning (cost estimates, a pre-booking research hub,
      an "Updated March 5" footer) and are out of scope for the daily-companion
      redesign — downstream tasks own these screens. Evergreen reference content
      (booked flight times, transport-pass notes, etiquette prep) already lives
      in data/days.js per-day `prep[]` and `plan[]` entries, which is where the
      companion surfaces it. No aux-tab UI is rebuilt in this scaffold.
    -->
    <main id="app-root"></main>

    <script type="module" src="app.js"></script>

    <!--
      Service worker registration (makes the site installable + offline-capable).
      Plain (non-module) script; a relative path so it resolves under the GitHub
      Pages project subpath (/japan_trip/) as well as the domain root. Guarded by
      a feature check, and registered on window load so it never competes with
      first paint.
    -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('[sw] registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
