<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newly Weds in Japan!</title>

    <!-- PWA: installable + offline (service worker registered before </body>). -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/icon-192.png" type="image/png">
    <meta name="theme-color" content="#0b3d66">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Japan Trip">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #203140;
            --ink-soft: #4f6577;
            --line: rgba(101, 78, 48, 0.28);
            --paper-bg: #e4d5bd;
            --paper-surface: rgba(241, 231, 214, 0.8);
            --paper-header: rgba(244, 236, 222, 0.92);
            --paper-nav: rgba(238, 227, 209, 0.92);
            --paper-btn: rgba(244, 236, 221, 0.95);
            --paper-panel: rgba(243, 233, 216, 0.9);
            --paper-panel-alt: rgba(236, 221, 198, 0.74);
            --card: rgba(245, 236, 221, 0.9);
            --card-solid: #f3e8d5;
            --brand-deep: #0b3d66;
            --brand-mid: #12628f;
            --brand-glow: #f3cb72;
            --shadow-lg: 0 24px 64px rgba(6, 28, 45, 0.25);
            --shadow-md: 0 10px 24px rgba(9, 40, 63, 0.18);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Manrope", "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--paper-bg);
            padding: 14px;
            overflow: hidden;
        }

        .wave-art {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 18% 16%, rgba(206, 183, 154, 0.3) 0%, rgba(206, 183, 154, 0) 40%),
                radial-gradient(circle at 80% 22%, rgba(194, 170, 143, 0.24) 0%, rgba(194, 170, 143, 0) 45%),
                radial-gradient(circle at 64% 74%, rgba(214, 191, 163, 0.18) 0%, rgba(214, 191, 163, 0) 46%),
                linear-gradient(152deg, rgba(243, 234, 221, 0.93), rgba(224, 210, 189, 0.87)),
                url("https://upload.wikimedia.org/wikipedia/commons/0/0a/The_Great_Wave_off_Kanagawa.jpg") center/cover no-repeat;
            transform: scale(1.03);
        }

        .wave-layer {
            position: fixed;
            left: -15%;
            width: 130%;
            border-radius: 50%;
            pointer-events: none;
            z-index: -2;
            opacity: 0.24;
            background:
                radial-gradient(ellipse at center, rgba(19, 94, 141, 0.58) 0%, rgba(19, 94, 141, 0.15) 54%, rgba(19, 94, 141, 0) 82%),
                linear-gradient(180deg, rgba(132, 183, 219, 0.38), rgba(132, 183, 219, 0.05));
            animation: swell 20s ease-in-out infinite;
        }

        .wave-layer.one {
            height: 40vh;
            bottom: -16vh;
        }

        .wave-layer.two {
            height: 34vh;
            bottom: 5vh;
            opacity: 0.2;
            animation-duration: 16s;
            animation-direction: reverse;
        }

        @keyframes swell {
            0% {
                transform: translateX(0) translateY(0) scale(1.02);
            }
            50% {
                transform: translateX(-5%) translateY(-2%) scale(1.07);
            }
            100% {
                transform: translateX(2%) translateY(1%) scale(1.02);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
    <!--
      Day-view screen styles. The hero slideshow + practical plan layer live
      here; the preserved theme block above keeps the :root tokens, resets, and
      the Great-Wave background (.wave-art / .wave-layer + @keyframes swell).
      Note: the theme sets `body { overflow: hidden }` for the old single-screen
      app; the day view scrolls, so we re-enable scrolling here.
    -->
    <style>
        body { overflow: auto; }

        #app-root {
            max-width: 720px;
            margin: 0 auto;
            min-height: calc(100vh - 28px);
        }

        /* --- Day view shell ---------------------------------------------- */
        .day-view {
            background: var(--paper-surface);
            border: 1px solid rgba(13, 52, 81, 0.22);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        /* --- Hero slideshow ---------------------------------------------- */
        .day-hero {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            max-height: 58vh;
            background: linear-gradient(160deg, rgba(18, 98, 143, 0.22), rgba(11, 61, 102, 0.32));
            overflow: hidden;
        }

        .hero-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.1s ease;
        }

        .hero-slide.is-active {
            opacity: 1;
        }

        .hero-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-scrim {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(8, 37, 61, 0.18) 0%,
                rgba(8, 37, 61, 0) 32%,
                rgba(8, 37, 61, 0) 60%,
                rgba(8, 37, 61, 0.28) 100%
            );
        }

        .day-hero-empty {
            aspect-ratio: 16 / 7;
            background:
                radial-gradient(circle at 30% 30%, rgba(206, 183, 154, 0.4), rgba(206, 183, 154, 0) 60%),
                linear-gradient(160deg, rgba(132, 183, 219, 0.32), rgba(224, 210, 189, 0.6));
        }

        /* --- Day header -------------------------------------------------- */
        .day-header {
            padding: 18px 20px 6px;
        }

        .day-kicker-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .day-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-mid);
        }

        .day-number {
            background: var(--brand-deep);
            color: #fff;
            border-radius: 999px;
            padding: 3px 11px;
            font-size: 0.74rem;
            font-weight: 700;
        }

        .day-base {
            color: var(--ink-soft);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .day-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: clamp(1.55rem, 5.5vw, 2.1rem);
            line-height: 1.12;
        }

        .day-intro {
            margin-top: 10px;
            color: var(--ink);
            font-size: 1rem;
            line-height: 1.5;
        }

        .day-intro-prefix {
            font-weight: 700;
            color: var(--brand-mid);
        }

        /* --- Section headings -------------------------------------------- */
        .section-heading {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.25rem;
            padding: 0 20px;
            margin: 22px 0 10px;
        }

        /* --- Plan list (timeline) ---------------------------------------- */
        .plan-section { padding-bottom: 4px; }

        .plan-list {
            list-style: none;
            padding: 0 20px;
            margin: 0;
        }

        .plan-item {
            display: grid;
            grid-template-columns: 22px 1fr;
            gap: 12px;
        }

        .plan-rail {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .plan-rail::after {
            content: "";
            flex: 1;
            width: 2px;
            background: var(--line);
            margin-top: 2px;
        }

        .plan-item:last-child .plan-rail::after { display: none; }

        .plan-dot {
            width: 13px;
            height: 13px;
            border-radius: 999px;
            background: var(--brand-mid);
            border: 2px solid var(--card-solid);
            box-shadow: 0 0 0 1px rgba(13, 65, 101, 0.3);
            margin-top: 5px;
            flex-shrink: 0;
        }

        .plan-body {
            background: var(--card);
            border: 1px solid rgba(13, 57, 89, 0.14);
            border-radius: var(--radius-md);
            padding: 12px 14px 12px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-md);
        }

        .plan-content {
            position: relative;
        }

        /* Carve a corner for the icon so text doesn't run under it.
           Only applied when the plan item actually has a map link. */
        .plan-content:has(.map-link) { padding-bottom: 36px; }
        .rec-card:has(.map-link) { padding-bottom: 38px; }
        .lodging-card:has(.map-link) { padding-bottom: 44px; }

        .plan-item-reserved .plan-body {
            border-color: rgba(173, 132, 44, 0.5);
            background: rgba(247, 231, 201, 0.78);
        }

        .plan-item-reserved .plan-dot {
            background: var(--brand-glow);
            box-shadow: 0 0 0 1px rgba(173, 132, 44, 0.6);
        }

        .plan-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .plan-time {
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            color: var(--brand-deep);
            font-size: 0.92rem;
        }

        .plan-tag {
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 0.64rem;
            font-weight: 800;
            color: #134f7b;
            background: rgba(234, 219, 196, 0.9);
            border: 1px solid rgba(16, 75, 115, 0.2);
            border-radius: 999px;
            padding: 3px 9px;
        }

        .tag-meal { color: #8a4f1f; background: rgba(244, 224, 199, 0.9); border-color: rgba(160, 100, 40, 0.3); }
        .tag-transit { color: #3a5a7a; }
        .tag-sight { color: #2e6b4a; background: rgba(214, 232, 214, 0.85); border-color: rgba(46, 107, 74, 0.28); }
        .tag-bar { color: #6b3f7a; background: rgba(231, 216, 238, 0.85); border-color: rgba(107, 63, 122, 0.28); }
        .tag-spa { color: #6b3f7a; background: rgba(231, 216, 238, 0.85); border-color: rgba(107, 63, 122, 0.28); }
        .tag-checkout { color: #5d6470; background: rgba(220, 220, 225, 0.7); border-color: rgba(93, 100, 112, 0.25); }

        /* Structured transit block — rendered below the title on plan items
           with a `transit` object. Three short stacked rows: line / stops /
           minutes. Muted and compact so it doesn't dominate phone widths. */
        .plan-transit {
            margin-top: 4px;
            margin-bottom: 6px;
            color: var(--ink-soft);
            font-size: 0.84rem;
            line-height: 1.35;
        }
        .plan-transit-line {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .plan-transit-emoji {
            font-size: 0.95rem;
            line-height: 1;
        }
        .plan-transit-line-name {
            font-weight: 600;
        }
        .plan-transit-stops {
            color: var(--ink);
            font-weight: 600;
            margin-top: 1px;
        }
        .plan-transit-minutes {
            font-size: 0.78rem;
            opacity: 0.85;
            margin-top: 1px;
        }

        .plan-reserved-badge {
            font-size: 0.64rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #5d4516;
            background: var(--brand-glow);
            border-radius: 999px;
            padding: 3px 9px;
        }

        .plan-title {
            color: var(--brand-deep);
            font-size: 1.02rem;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .plan-note {
            color: #2c4459;
            font-size: 0.9rem;
            line-height: 1.46;
        }

        /* --- Map links (icon-only, muted, anchored bottom-right) --------- */
        .map-link {
            position: absolute;
            bottom: 6px;
            right: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 999px;
            background: transparent;
            color: var(--brand-deep);
            text-decoration: none;
            opacity: 0.5;
            transition: opacity 0.15s ease, background 0.15s ease;
        }

        .map-link::before {
            content: "📍";
            font-size: 1.05rem;
            line-height: 1;
            filter: grayscale(45%);
        }

        .map-link:hover { opacity: 1; background: rgba(13, 57, 89, 0.08); }
        .map-link:focus-visible { opacity: 1; outline: 2px solid var(--brand-mid); outline-offset: 2px; }

        /* --- Day-part sections (Morning / Afternoon / Evening) ----------- */
        .day-part {
            margin-bottom: 14px;
        }

        .day-part:last-child {
            margin-bottom: 0;
        }

        .day-part-header {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            padding: 12px 14px;
            border: 1px solid rgba(13, 57, 89, 0.18);
            border-radius: var(--radius-md);
            background: var(--card-solid);
            color: var(--brand-deep);
            text-align: left;
            cursor: pointer;
            font-family: inherit;
        }

        .day-part-header:hover {
            background: rgba(244, 236, 221, 0.6);
        }

        .day-part-header:focus-visible {
            outline: 2px solid var(--brand-mid);
            outline-offset: 2px;
        }

        .day-part-name {
            flex-shrink: 0;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.02em;
        }

        .day-part-summary {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.84rem;
            color: var(--ink-soft);
            font-weight: 500;
        }

        .day-part-chev {
            flex-shrink: 0;
            font-size: 0.9rem;
            color: var(--brand-mid);
            transition: transform 0.2s ease;
        }

        .day-part.is-open .day-part-chev {
            transform: rotate(180deg);
        }

        .day-part-body {
            margin-top: 10px;
        }

        .day-part-body[hidden] {
            display: none;
        }

        /* --- Recommendation expansion ------------------------------------ */
        .rec-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            min-height: 44px;
            margin-top: 10px;
            padding: 10px 14px;
            border: 1px dashed rgba(16, 75, 115, 0.42);
            border-radius: var(--radius-md);
            background: rgba(244, 236, 221, 0.7);
            color: var(--brand-deep);
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .rec-toggle:hover { background: rgba(255, 255, 255, 0.65); }
        .rec-toggle:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: 2px; }

        .rec-toggle-chev { transition: transform 0.2s ease; font-size: 0.9rem; }
        .rec-toggle.is-open .rec-toggle-chev { transform: rotate(180deg); }

        .rec-panel {
            display: grid;
            gap: 10px;
            margin-top: 10px;
        }
        .rec-panel[hidden] { display: none; }

        .rec-card {
            position: relative;
            border: 1px solid rgba(13, 57, 89, 0.16);
            border-radius: var(--radius-md);
            background: var(--card-solid);
            padding: 11px 13px 13px;
        }

        .rec-name {
            color: var(--brand-deep);
            font-size: 0.94rem;
            margin-bottom: 4px;
        }

        .rec-walk {
            font-size: 0.76rem;
            font-weight: 700;
            color: #2e6b4a;
            margin-bottom: 6px;
        }

        .rec-walk::before { content: "🚶 "; }

        .rec-walk-from {
            font-weight: 500;
            color: var(--ink-soft);
        }

        .rec-walk-sep {
            color: var(--ink-soft);
            font-weight: 500;
        }

        .rec-transit {
            font-weight: 500;
            color: var(--ink-soft);
        }

        .rec-transit-min {
            font-weight: 700;
            color: #2e6b4a;
        }

        .rec-pros {
            list-style: none;
            padding: 0;
            margin: 0 0 6px;
            display: grid;
            gap: 4px;
        }

        .rec-pro, .rec-con {
            display: flex;
            gap: 7px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #2c4459;
        }

        .rec-con { color: #8a3f30; }

        .rec-mark {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 800;
            margin-top: 2px;
        }

        .rec-mark-pro { background: rgba(46, 107, 74, 0.18); color: #2e6b4a; }
        .rec-mark-con { background: rgba(184, 92, 70, 0.18); color: #b85c46; }

        /* --- Lodging card ------------------------------------------------ */
        .lodging-card {
            position: relative;
            margin: 20px 20px 22px;
            border: 1px solid rgba(13, 65, 101, 0.2);
            border-radius: var(--radius-lg);
            background:
                radial-gradient(circle at 88% 12%, rgba(191, 166, 136, 0.22) 0%, rgba(191, 166, 136, 0) 55%),
                linear-gradient(150deg, var(--paper-panel), var(--paper-panel-alt));
            padding: 16px 18px 18px;
            box-shadow: var(--shadow-md);
        }

        .lodging-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--brand-mid);
            margin-bottom: 5px;
        }

        .lodging-name {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.15rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .lodging-address {
            color: var(--ink-soft);
            font-size: 0.86rem;
            margin-bottom: 8px;
        }

        .lodging-breakfast {
            color: #2c4459;
            font-size: 0.88rem;
            line-height: 1.45;
        }

        .lodging-breakfast-label { font-weight: 800; color: var(--brand-deep); }

        /* --- Reminisce seam (future photo gallery placeholder) ----------- */
        /* --- Reminisce view: blue "memory frame" → masonry gallery ------- */
        .reminisce-frame {
            margin: 18px 20px 0;
            border: 1.5px solid var(--brand-deep);
            border-radius: var(--radius-lg);
            background: var(--paper-surface);
            padding: 24px 18px 0;
        }
        .reminisce-frame .day-header {
            margin: 0;
        }
        .reminisce-frame-seam {
            margin: 16px 0 0;
            padding: 11px 0 13px;
            border-top: 1px dashed var(--line);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--ink-soft);
        }

        /* The gallery host is a fixed ~66vh window that scrolls INTERNALLY, so a
           150-photo day never grows the page — the mosaic grid lives inside it.
           overscroll-behavior:contain keeps a flick from chaining to the page. */
        .reminisce-gallery-host {
            margin: 12px 20px 0;
            max-height: 66vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: rgba(16, 75, 115, 0.04);
        }
        .reminisce-gallery-host .reminisce-empty-note,
        .reminisce-gallery-host .reminisce-loading-note {
            margin: 14px 16px;
        }

        /* Chronological mosaic: square tiles by default, portrait tiles span two
           rows, landscape span two columns; `dense` backfills gaps a span opens so
           there are no holes (at worst adjacent photos swap slots). grid-auto-rows
           is a fixed unit so a tile's height is known BEFORE its image loads —
           tiles never shift under a scrolling finger. */
        .reminisce-gallery {
            margin: 8px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 42vw;
            gap: 8px;
            grid-auto-flow: row dense;
        }
        .gallery-tile-tall { grid-row: span 2; }
        .gallery-tile-wide { grid-column: span 2; }
        /* A tall tile spans two 42vw rows (~84vw high). Its content-visibility
           placeholder must match that real height, else an off-screen tall tile is
           estimated at 42vw and everything after it jumps ~42vw when it scrolls
           into view — the layout-shift the fixed-row grid otherwise prevents. */
        .gallery-tile-tall { contain-intrinsic-size: 42vw 84vw; }
        .reminisce-photo {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
            line-height: 0;
            background: rgba(16, 75, 115, 0.08);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            /* The grid row sizes the tile, so far-off tiles can skip layout/paint. */
            content-visibility: auto;
            contain-intrinsic-size: 42vw;
            transition: transform 0.15s ease;
        }
        .reminisce-photo:active { transform: scale(0.98); }
        .reminisce-photo:focus-visible {
            outline: 2px solid var(--brand-mid);
            outline-offset: 2px;
        }
        .reminisce-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .reminisce-empty-note {
            margin: 14px 20px 0;
            text-align: center;
            color: var(--ink-soft);
            font-size: 0.88rem;
            line-height: 1.45;
        }
        /* Live-gallery first-snapshot affordance: a quiet pulsing line on-theme.
           Replaced by the photo grid (or empty-note) on the first snapshot. */
        .reminisce-loading-note {
            margin: 14px 20px 0;
            text-align: center;
            color: var(--ink-soft);
            font-size: 0.88rem;
            line-height: 1.45;
            animation: reminisce-pulse 1.4s ease-in-out infinite;
        }
        @keyframes reminisce-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }
        @media (prefers-reduced-motion: reduce) {
            .reminisce-loading-note { animation: none; opacity: 0.7; }
        }

        /* --- Lightbox: full-screen swipeable photo viewer ---------------- */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            background: rgba(8, 20, 30, 0.94);
        }
        .lightbox[hidden] { display: none; }
        .lightbox-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px 8px 16px;
            color: rgba(255, 255, 255, 0.92);
            flex: 0 0 auto;
        }
        .lightbox-counter {
            font-size: 0.9rem;
            letter-spacing: 0.04em;
        }
        .lightbox-close {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1.9rem;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
        }
        .lightbox-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .lightbox-track {
            flex: 1 1 auto;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .lightbox-slide {
            flex: 0 0 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px 28px;
        }
        .lightbox-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        /* --- Empty / sparse placeholder ---------------------------------- */
        .day-placeholder {
            padding: 30px 22px 36px;
            text-align: center;
        }

        .placeholder-kicker {
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-mid);
            margin-bottom: 8px;
        }

        .placeholder-title {
            font-family: "Playfair Display", "Georgia", serif;
            color: var(--brand-deep);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .placeholder-note {
            color: var(--ink-soft);
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 38ch;
            margin: 0 auto;
        }

        /* --- Framing variants -------------------------------------------- */
        .framing-anticipation .day-kicker { color: #2e6b4a; }
        .framing-anticipation .day-number { background: #2e6b4a; }
        .framing-anticipation-hero .hero-scrim {
            background: linear-gradient(180deg, rgba(46, 107, 74, 0.16) 0%, rgba(8, 37, 61, 0) 45%, rgba(8, 37, 61, 0.3) 100%);
        }

        /* Reminisce identity: calm "blue memory print" (no hero, no sepia). */
        .framing-reminisce .day-kicker { color: var(--brand-mid); }
        .framing-reminisce .day-number { background: var(--brand-deep); }

        /* --- Day navigation (prev / position / next) --------------------- */
        .day-screen { display: flex; flex-direction: column; gap: 14px; }

        .day-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: var(--paper-nav);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(6px);
        }

        /* Prev/next chevron group — sits on the trailing (right) edge. */
        .day-nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
            grid-column: 3;
            justify-self: end;
        }

        /* Shared base for the minimal circular nav buttons (☰ + ‹ ›). Each is a
           ~30px glyph circle inside a 44px tap target, low-alpha blue border,
           transparent fill, --brand-mid glyph, faded at rest. */
        .day-nav-btn {
            position: relative;
            /* Contain the ::before stacking context so its negative z-index
               drops the circle behind the glyph but NOT behind the nav bar. */
            isolation: isolate;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* ≥44px transparent tap target (AC4). The visible ~30px circle is
               drawn by ::before, so the glyph reads as a small circle while the
               pointer/touch hit area stays a full 44px. */
            min-width: 44px;
            min-height: 44px;
            padding: 0;
            font-family: inherit;
            line-height: 1;
            color: var(--brand-mid);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* The three nav buttons share the ~30px visual circle (border + rest
           opacity + hover/focus fill), drawn on a centered ::before behind the
           glyph. The button box itself stays 44px (the hit area); only this
           pseudo-element is 30px (the visible chrome). */
        .day-nav-hamburger,
        .day-nav-prev,
        .day-nav-next {
            opacity: 0.65;
            transition: opacity 0.18s ease;
        }

        .day-nav-hamburger::before,
        .day-nav-prev::before,
        .day-nav-next::before {
            content: "";
            position: absolute;
            z-index: -1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 1px solid rgba(18, 98, 143, 0.22);
            border-radius: 999px;
            background: transparent;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        .day-nav-hamburger {
            grid-column: 1;
            justify-self: start;
        }

        /* Inline hamburger SVG — inherits --brand-mid via stroke:currentColor. */
        .nav-icon {
            display: block;
            color: var(--brand-mid);
        }

        .day-nav-prev,
        .day-nav-next {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .day-nav-hamburger:hover:not(:disabled),
        .day-nav-hamburger:focus-visible,
        .day-nav-prev:hover:not(:disabled),
        .day-nav-prev:focus-visible,
        .day-nav-next:hover:not(:disabled),
        .day-nav-next:focus-visible {
            opacity: 1;
        }

        /* Faint blue fill + brighter border on the visible circle (::before)
           when the 44px button is hovered/keyboard-focused. */
        .day-nav-hamburger:hover:not(:disabled)::before,
        .day-nav-hamburger:focus-visible::before,
        .day-nav-prev:hover:not(:disabled)::before,
        .day-nav-prev:focus-visible::before,
        .day-nav-next:hover:not(:disabled)::before,
        .day-nav-next:focus-visible::before {
            background: rgba(18, 98, 143, 0.08);
            border-color: rgba(18, 98, 143, 0.4);
        }

        .day-nav-btn:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: 2px; }
        .day-nav-prev:disabled,
        .day-nav-next:disabled { opacity: 0.3; cursor: default; }

        .day-nav-pos {
            grid-column: 2;
            font-family: "Playfair Display", "Georgia", serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.02em;
            line-height: 1.2;
            text-align: center;
            white-space: nowrap;
        }

        /* --- ☰ popover menu (body-mounted, position:fixed) -------------- */
        .nav-menu {
            position: relative;
            min-width: 188px;
            padding: 6px;
            background: var(--paper-panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(6px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-menu[hidden] { display: none; }

        /* Optional upward caret pointing back at the ☰ trigger. Drawn as a
           rotated square sharing the panel's border + background; positioned
           near the panel's leading edge (the ☰ sits at the left). */
        .nav-menu::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 18px;
            width: 11px;
            height: 11px;
            background: var(--paper-panel);
            border-left: 1px solid var(--line);
            border-top: 1px solid var(--line);
            transform: rotate(45deg);
        }

        .nav-menu-item {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            min-height: 44px;
            text-align: left;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: var(--brand-deep);
            background: transparent;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .nav-menu-icon {
            flex: none;
            display: block;
            color: var(--brand-mid);
        }

        .nav-menu-label { flex: 1 1 auto; }

        /* Hairline divider between rows (role="separator"). */
        .nav-menu-divider {
            height: 1px;
            margin: 3px 10px;
            background: var(--line);
        }

        .nav-menu-item:hover:not(:disabled),
        .nav-menu-item:focus-visible {
            background: rgba(18, 98, 143, 0.1);
        }

        .nav-menu-item:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: -2px; }
        .nav-menu-item:disabled { opacity: 0.4; cursor: default; }

        /* --- Photo-upload modals (body-mounted, lightbox pattern) ------- */
        .photo-modal {
            position: fixed;
            inset: 0;
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(8, 20, 30, 0.55);
            backdrop-filter: blur(2px);
        }
        .photo-modal[hidden] { display: none; }
        .photo-modal-card {
            position: relative; /* anchors the absolute "–" minimize button */
            width: min(420px, 100%);
            max-height: 88vh;
            overflow-y: auto;
            background: var(--card-solid);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 26px 24px 22px;
        }
        .photo-modal-title {
            font-family: "Playfair Display", "Georgia", serif;
            font-size: 1.4rem;
            color: var(--brand-deep);
            margin-bottom: 10px;
        }
        .photo-modal-note {
            color: var(--ink-soft);
            font-size: 0.96rem;
            line-height: 1.45;
            margin-bottom: 16px;
        }
        .photo-uploader-choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .photo-uploader-choice {
            font-family: inherit;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--brand-deep);
            background: var(--paper-btn);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            min-height: 52px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.15s ease;
        }
        .photo-uploader-choice:hover { transform: translateY(-1px); }
        .photo-uploader-choice:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(18, 98, 143, 0.3);
        }
        .photo-date-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1.05rem;
            font-family: inherit;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            margin-bottom: 18px;
        }
        .photo-date-input:focus {
            outline: none;
            border-color: var(--brand-mid);
            box-shadow: 0 0 0 3px rgba(18, 98, 143, 0.18);
        }
        .photo-modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .photo-modal-btn {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            color: #fbf3df;
            background: linear-gradient(135deg, var(--brand-mid), var(--brand-deep));
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 18px;
            min-height: 44px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: transform 0.12s ease, opacity 0.18s ease;
        }
        .photo-modal-btn:hover { transform: translateY(-1px); }
        .photo-modal-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(243, 203, 114, 0.55);
        }
        .photo-modal-btn[hidden] { display: none; }
        .photo-modal-btn-ghost {
            color: var(--brand-deep);
            background: transparent;
            box-shadow: none;
            border: 1px solid var(--line);
        }
        .photo-progress-status {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 14px;
        }
        .photo-progress-bar {
            height: 8px;
            width: 100%;
            background: rgba(101, 78, 48, 0.18);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .photo-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--brand-mid), var(--brand-glow));
            transition: width 0.25s ease;
        }

        /* "–" minimize control on the progress sheet — top-right of the card,
           44px tap target, icon-only (aria-label carries the name). */
        .photo-modal-minimize {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            color: var(--brand-deep);
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.15s ease;
        }
        .photo-modal-minimize:hover { background: rgba(18, 98, 143, 0.1); }
        .photo-modal-minimize:focus-visible {
            outline: 2px solid var(--brand-mid);
            outline-offset: 2px;
        }

        /* Floating upload pill (minimized progress sheet). Body-mounted +
           position:fixed (same containing-block escape as the lightbox), bottom-
           center above the in-flow day-nav, below the lightbox (z 1000) and the
           modal backdrop (z 1100), above the ☰ popover (z 50). One <button> =
           the whole ≥44px tap target; the fade is an opacity transition the JS
           removes the node after. */
        .photo-progress-pill {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 900;
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: calc(100% - 24px);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            color: #fbf3df;
            background: linear-gradient(135deg, var(--brand-mid), var(--brand-deep));
            border: none;
            border-radius: 999px;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.45s ease;
        }
        .photo-progress-pill:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(243, 203, 114, 0.55), var(--shadow-lg);
        }
        /* "✓ N added" success state (finish-while-minimized) — anticipation
           green, then auto-fade. */
        .photo-progress-pill.is-success {
            background: linear-gradient(135deg, #2e6b4a, var(--brand-deep));
        }
        .photo-progress-pill.is-fading { opacity: 0; }
        @media (prefers-reduced-motion: reduce) {
            .photo-progress-pill { transition: none; }
        }

        /* --- Evening "Prep for tomorrow" -------------------------------- */
        .evening-prep {
            background:
                linear-gradient(150deg, rgba(11, 61, 102, 0.14), rgba(243, 203, 114, 0.12));
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 18px 20px 20px;
            backdrop-filter: blur(6px);
        }

        .evening-prep-cta {
            font-family: inherit;
            font-size: 1.02rem;
            font-weight: 700;
            color: #fff;
            background: var(--brand-deep);
            border: none;
            border-radius: 999px;
            padding: 11px 20px;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .evening-prep-cta:hover { background: var(--brand-mid); transform: translateY(-1px); }
        .evening-prep-cta:focus-visible { outline: 2px solid var(--brand-glow); outline-offset: 2px; }

        .evening-prep-day {
            font-family: "Playfair Display", "Georgia", serif;
            font-size: 1.1rem;
            color: var(--ink);
            margin-top: 12px;
        }

        .evening-prep-list { list-style: none; margin-top: 10px; display: grid; gap: 8px; }

        .evening-prep-item {
            position: relative;
            padding-left: 18px;
            color: var(--ink-soft);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .evening-prep-item::before {
            content: "•";
            position: absolute;
            left: 2px;
            color: var(--brand-mid);
        }

        .evening-prep-empty { margin-top: 10px; color: var(--ink-soft); font-size: 0.95rem; }

        /* --- Pre-trip overview / countdown (interim seam) --------------- */
        .overview-view {
            background: var(--paper-surface);
            border: 1px solid rgba(13, 52, 81, 0.22);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(8px);
            padding: 40px 28px 36px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .overview-kicker {
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.78rem;
            color: var(--brand-mid);
            font-weight: 700;
        }

        .overview-title {
            font-family: "Playfair Display", "Georgia", serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            color: var(--ink);
            line-height: 1.15;
        }

        .overview-count { display: flex; flex-direction: column; align-items: center; gap: 2px; }

        .overview-count-num {
            font-family: "Playfair Display", "Georgia", serif;
            font-size: clamp(3rem, 14vw, 5rem);
            line-height: 1;
            color: var(--brand-deep);
        }

        .overview-count-label {
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.85rem;
            color: var(--ink-soft);
        }

        .overview-dates { color: var(--ink-soft); font-size: 0.95rem; }

        /* --- All-days index (pre-trip home) ------------------------------ */
        .day-index {
            width: 100%;
            margin-top: 8px;
            text-align: left;
        }

        .day-index-heading {
            font-family: "Playfair Display", "Georgia", serif;
            font-size: 1.2rem;
            color: var(--brand-deep);
            margin-bottom: 12px;
            text-align: center;
        }

        .day-index-list { display: grid; gap: 8px; }

        .day-index-row {
            display: grid;
            grid-template-columns: minmax(78px, auto) 1fr auto;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            font-family: inherit;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 12px 14px;
            cursor: pointer;
            transition: background 0.16s ease, transform 0.16s ease, border-color 0.16s ease;
        }

        .day-index-row:hover { background: var(--card-solid); transform: translateY(-1px); }
        .day-index-row:focus-visible { outline: 2px solid var(--brand-mid); outline-offset: 2px; }

        .day-index-row-tbd { opacity: 0.82; }
        .day-index-row-today { border-color: var(--brand-mid); box-shadow: 0 0 0 2px var(--brand-glow) inset, var(--shadow-md); }

        .day-index-left { display: flex; flex-direction: column; gap: 2px; }

        .day-index-num {
            font-weight: 800;
            font-size: 0.92rem;
            color: var(--brand-deep);
        }

        .day-index-date {
            font-size: 0.8rem;
            color: var(--ink-soft);
        }

        .day-index-mid { min-width: 0; }

        .day-index-region {
            font-size: 0.95rem;
            color: var(--ink);
            font-weight: 600;
        }

        .day-index-status {
            justify-self: end;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .day-index-status.is-locked { color: var(--brand-deep); background: var(--brand-glow); }
        .day-index-status.is-tbd { color: var(--ink-soft); background: rgba(101, 78, 48, 0.14); }

        /* --- Time-travel mode indicator (only shown when ?now override is active) */
        .time-travel-banner {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: calc(100% - 24px);
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--brand-deep);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: var(--shadow-md);
        }

        .time-travel-banner-label {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.66rem;
            font-weight: 800;
            color: var(--brand-glow);
            white-space: nowrap;
        }

        .time-travel-banner-when {
            font-variant-numeric: tabular-nums;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .time-travel-banner-clear {
            flex-shrink: 0;
            color: #fff;
            text-decoration: underline;
            font-weight: 700;
            white-space: nowrap;
        }

        .time-travel-banner-clear:focus-visible {
            outline: 2px solid var(--brand-glow);
            outline-offset: 2px;
        }

        /* --- Mobile tuning ----------------------------------------------- */
        @media (max-width: 760px) {
            body { padding: 8px; }
            #app-root { min-height: calc(100vh - 16px); }
            .day-hero { aspect-ratio: 1 / 1; max-height: 64vh; }
            .day-header { padding: 16px 16px 4px; }
            .section-heading { padding: 0 16px; }
            .plan-list { padding: 0 16px; }
            .lodging-card { margin: 18px 16px 20px; }
            .reminisce-frame { margin: 16px 16px 0; }
            .reminisce-gallery-host { margin: 12px 16px 0; }
            .reminisce-empty-note { margin: 14px 16px 0; }
            .day-screen { gap: 10px; }
            .day-nav {
                padding: 10px 12px;
                gap: 10px;
            }
            .day-nav-group { gap: 4px; }
            .day-nav-pos { font-size: 1.25rem; }
            .evening-prep { padding: 16px; }
            .overview-view { padding: 32px 18px; }
            .day-index-row { padding: 11px 12px; gap: 10px; grid-template-columns: minmax(68px, auto) 1fr auto; }
            .day-index-region { font-size: 0.9rem; }
        }

        /* --- Auth gate overlay (auth-password-gate) ------------------------- */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* Transparent so the site's Great Wave background (.wave-art /
               .wave-layer) shows through — the gate is the trip's landing, so it
               wears the same background as the rest of the app. The app only
               mounts after auth (and is torn down on sign-out), so #app-root is
               empty behind the gate — nothing peeks through. */
            background: transparent;
        }

        .login-overlay[hidden] { display: none; }

        .login-card {
            width: min(420px, 100%);
            background: var(--card-solid);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 36px 30px 30px;
            text-align: center;
        }

        .login-kicker {
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--brand-mid);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-title {
            font-family: "Playfair Display", "Georgia", serif;
            font-size: 1.9rem;
            color: var(--brand-deep);
            margin-bottom: 8px;
        }

        .login-sub {
            color: var(--ink-soft);
            font-size: 0.98rem;
            margin-bottom: 22px;
        }

        .login-label {
            display: block;
            text-align: left;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .login-input {
            width: 100%;
            padding: 13px 14px;
            font-size: 1.05rem;
            font-family: inherit;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--brand-mid);
            box-shadow: 0 0 0 3px rgba(18, 98, 143, 0.18);
        }

        .login-submit {
            width: 100%;
            margin-top: 18px;
            padding: 13px 16px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            color: #fbf3df;
            background: linear-gradient(135deg, var(--brand-mid), var(--brand-deep));
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: transform 0.12s ease, opacity 0.18s ease;
        }

        .login-submit:hover { transform: translateY(-1px); }
        .login-submit:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(243, 203, 114, 0.55);
        }

        .login-submit[disabled] {
            cursor: progress;
            opacity: 0.65;
            transform: none;
        }

        .login-error {
            margin-top: 16px;
            color: #9a2b2b;
            background: rgba(154, 43, 43, 0.08);
            border: 1px solid rgba(154, 43, 43, 0.25);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: 0.92rem;
        }

        .login-error[hidden] { display: none; }
    </style>
</head>
<body>
    <div class="wave-art" aria-hidden="true"></div>
    <div class="wave-layer one" aria-hidden="true"></div>
    <div class="wave-layer two" aria-hidden="true"></div>

    <!--
      Slim shell. The whole UI is rendered by app.js into #app-root from
      data/days.js (the single source of truth). No build step, no bundler —
      plain ES modules served as static files on GitHub Pages.

      AUX-TAB DECISION: the old tabbed app's aux tabs (Transport, Costs/budget,
      Flights, Culture+Prep, Priority Research) were DROPPED here. They were
      stale pre-booking planning (cost estimates, a pre-booking research hub,
      an "Updated March 5" footer) and are out of scope for the daily-companion
      redesign — downstream tasks own these screens. Evergreen reference content
      (booked flight times, transport-pass notes, etiquette prep) already lives
      in data/days.js per-day `prep[]` and `plan[]` entries, which is where the
      companion surfaces it. No aux-tab UI is rebuilt in this scaffold.
    -->
    <main id="app-root"></main>

    <!--
      Auth gate (auth-password-gate). A static, fully-covering login overlay:
      one shared password unlocks the journal via Firebase Auth (signed in as a
      single shared account; only the password is secret). app.js shows this
      overlay first and reveals #app-root only once onAuthStateChanged reports a
      user. The markup is static (no interpolation) — XSS-safe; the typed
      password is never written to the DOM or persisted. Hidden by default
      (hidden attribute); app.js removes it to display the gate when no session
      exists, and re-hides it after sign-in.
    -->
    <div id="login-overlay" class="login-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="login-title">
      <form id="login-form" class="login-card" novalidate onsubmit="return false">
        <p class="login-kicker">Newly Weds in Japan</p>
        <h1 id="login-title" class="login-title">Welcome back</h1>
        <p class="login-sub">Enter the shared password to open the journal.</p>
        <label for="login-password" class="login-label">Password</label>
        <input
          id="login-password"
          class="login-input"
          type="password"
          name="password"
          autocomplete="current-password"
          aria-describedby="login-error"
          required
        />
        <button id="login-submit" class="login-submit" type="submit">Enter</button>
        <p id="login-error" class="login-error" role="alert" aria-live="polite" hidden></p>
      </form>
    </div>

    <script type="module" src="app.js"></script>

    <!--
      Service worker registration (makes the site installable + offline-capable).
      Plain (non-module) script; a relative path so it resolves under the GitHub
      Pages project subpath (/japan_trip/) as well as the domain root. Guarded by
      a feature check, and registered on window load so it never competes with
      first paint.
    -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('[sw] registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
